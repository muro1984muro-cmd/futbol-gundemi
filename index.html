<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Futbol Gündem</title>

<style>

/* =========================
   GENEL
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: #f8fafc;

    /* FUTBOL TEMALI ARKA PLAN */
    background:
        radial-gradient(circle at 15% 20%, rgba(29,78,216,0.35), transparent 25%),
        radial-gradient(circle at 85% 70%, rgba(220,38,38,0.18), transparent 25%),
        linear-gradient(135deg, #020617, #071a3d 45%, #020617);

    min-height: 100vh;
}

/* ARKA PLAN IŞIKLARI */

body::before {
    content: "";
    position: fixed;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: rgba(37,99,235,0.08);
    filter: blur(80px);
    top: 100px;
    left: -150px;
    z-index: -1;
}

body::after {
    content: "";
    position: fixed;
    width: 450px;
    height: 450px;
    border-radius: 50%;
    background: rgba(220,38,38,0.07);
    filter: blur(90px);
    bottom: 0;
    right: -150px;
    z-index: -1;
}


/* =========================
   HEADER
========================= */

header {
    background:
        linear-gradient(
            rgba(2,6,23,0.55),
            rgba(7,26,61,0.9)
        );

    border-bottom: 1px solid rgba(255,255,255,0.12);

    color: white;
    text-align: center;
    padding: 40px 15px;

    box-shadow: 0 10px 40px rgba(0,0,0,0.35);
}

header h1 {
    margin: 0;
    font-size: 44px;
    letter-spacing: 1px;
    text-shadow: 0 3px 15px rgba(0,0,0,0.5);
}

header p {
    margin: 10px 0 0;
    color: #cbd5e1;
}


/* =========================
   MENÜ
========================= */

nav {
    background: rgba(2,6,23,0.92);

    backdrop-filter: blur(12px);

    padding: 15px;

    text-align: center;

    position: sticky;
    top: 0;
    z-index: 100;

    border-bottom: 1px solid rgba(255,255,255,0.08);
}

nav button {
    background: transparent;
    border: 0;

    color: white;

    font-size: 16px;
    font-weight: bold;

    margin: 0 8px;

    padding: 10px 14px;

    cursor: pointer;

    transition: 0.2s;
}

nav button:hover {
    background: #1d4ed8;
    border-radius: 9px;
    transform: translateY(-2px);
}

.yonetici-aciklama {
    color: #94a3b8;
    font-size: 13px;
    margin-left: 5px;
}


/* =========================
   ANA ALAN
========================= */

.container {
    max-width: 1150px;
    margin: 35px auto;
    padding: 0 15px;
}


/* =========================
   GİRİŞ
========================= */

#login {
    display: none;

    background: rgba(255,255,255,0.97);

    color: #111827;

    max-width: 450px;

    margin: 30px auto;

    padding: 25px;

    border-radius: 18px;

    box-shadow:
        0 15px 50px rgba(0,0,0,0.35);
}

#login h2 {
    margin-top: 0;
}


/* =========================
   INPUTLAR
========================= */

label {
    display: block;

    font-weight: bold;

    margin-top: 15px;
}

input,
textarea,
select {

    width: 100%;

    padding: 13px;

    margin-top: 7px;

    border: 1px solid #cbd5e1;

    border-radius: 9px;

    font-size: 16px;
}

textarea {
    min-height: 150px;

    resize: vertical;
}


/* =========================
   BUTONLAR
========================= */

.girisButon {

    margin-top: 15px;

    background: #1d4ed8;

    color: white;

    border: none;

    padding: 13px 25px;

    border-radius: 8px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}

.yayinla {

    margin-top: 20px;

    background: #e11d48;

    color: white;

    border: none;

    padding: 14px 25px;

    border-radius: 9px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}

.cikis {

    margin-top: 15px;

    background: #111827;

    color: white;

    border: none;

    padding: 12px 20px;

    border-radius: 8px;

    cursor: pointer;
}

.sil {

    background: #111827;

    color: white;

    border: 0;

    padding: 9px 13px;

    border-radius: 7px;

    cursor: pointer;
}

.sil:hover {
    background: #dc2626;
}


/* =========================
   YÖNETİCİ PANELİ
========================= */

#yoneticiPaneli {

    display: none;

    background: rgba(255,255,255,0.97);

    color: #111827;

    padding: 25px;

    border-radius: 18px;

    margin-bottom: 30px;

    box-shadow:
        0 15px 50px rgba(0,0,0,0.35);
}


/* =========================
   HABER BAŞLIĞI
========================= */

#anaIcerik > h2 {

    font-size: 28px;

    border-left: 5px solid #e11d48;

    padding-left: 12px;

    margin-bottom: 20px;
}


/* =========================
   HABERLER
========================= */

.haberler {

    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(280px, 1fr));

    gap: 25px;
}

.haber {

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.98),
            rgba(241,245,249,0.98)
        );

    color: #111827;

    border-radius: 18px;

    overflow: hidden;

    box-shadow:
        0 10px 35px rgba(0,0,0,0.28);

    cursor: pointer;

    transition:
        transform 0.25s,
        box-shadow 0.25s;
}

.haber:hover {

    transform:
        translateY(-7px)
        scale(1.01);

    box-shadow:
        0 18px 45px rgba(0,0,0,0.4);
}

.haber img {

    width: 100%;

    height: 220px;

    object-fit: cover;

    display: block;
}

.haber-icerik {

    padding: 20px;
}

.kategori {

    color: #e11d48;

    font-size: 13px;

    font-weight: bold;

    text-transform: uppercase;
}

.haber h2 {

    margin: 8px 0;

    font-size: 21px;
}

.haber p {

    color: #475569;

    line-height: 1.6;
}

.tarih {

    color: #64748b;

    font-size: 13px;

    margin-top: 10px;
}


/* =========================
   HABER DETAY
========================= */

#haberDetay {

    display: none;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.98),
            rgba(241,245,249,0.98)
        );

    color: #111827;

    border-radius: 20px;

    padding: 25px;

    box-shadow:
        0 15px 50px rgba(0,0,0,0.35);
}

.detay-foto {

    width: 100%;

    max-height: 550px;

    object-fit: cover;

    border-radius: 16px;

    margin-bottom: 20px;
}

.geri {

    background: #1d4ed8;

    color: white;

    border: none;

    padding: 12px 20px;

    border-radius: 8px;

    font-weight: bold;

    cursor: pointer;

    margin-bottom: 20px;
}

.detay-kategori {

    color: #e11d48;

    font-weight: bold;

    font-size: 14px;
}

#detayBaslik {

    font-size: 40px;

    margin: 10px 0;
}

.detay-tarih {

    color: #64748b;

    margin-bottom: 25px;
}

.detay-metin {

    font-size: 19px;

    line-height: 1.8;

    white-space: pre-line;
}


/* =========================
   BOŞ
========================= */

.bos {

    background: rgba(255,255,255,0.97);

    color: #475569;

    padding: 30px;

    border-radius: 15px;

    text-align: center;
}


/* =========================
   MOBİL
========================= */

@media (max-width: 600px) {

    header h1 {
        font-size: 31px;
    }

    nav button {
        margin: 3px;
    }

    .yonetici-aciklama {
        display: block;
        margin-top: 8px;
    }

    #detayBaslik {
        font-size: 28px;
    }

    .detay-metin {
        font-size: 17px;
    }
}

</style>
</head>


<body>


<header>

    <h1>⚽ FUTBOL GÜNDEM</h1>

    <p>Futbolun nabzı burada atıyor!</p>

</header>


<nav>

    <button onclick="anaSayfa()">
        🏠 Ana Sayfa
    </button>

    <button onclick="girisAc()">
        🔐 Yönetici Girişi
    </button>

    <span class="yonetici-aciklama">
        Sadece site yöneticisi haber yazmak için giriş yapabilir.
    </span>

</nav>


<div class="container">


<!-- =========================
     GİRİŞ
========================= -->

<div id="login">

    <h2>🔐 Yönetici Girişi</h2>

    <p>
        Haber yayınlamak için yönetici şifresini gir.
    </p>

    <label>Şifre</label>

    <input
        id="sifre"
        type="password"
        placeholder="Yönetici şifresi"
    >

    <button
        class="girisButon"
        onclick="girisYap()"
    >
        Giriş Yap
    </button>

    <div
        id="hata"
        style="color:#dc2626;font-weight:bold;margin-top:10px;"
    ></div>

</div>


<!-- =========================
     YÖNETİCİ PANELİ
========================= -->

<div id="yoneticiPaneli">

    <h2>👑 Yönetici Paneli</h2>

    <p>
        Buradan Futbol Gündem'e haber yayınlayabilirsin.
    </p>

    <label>Haber Başlığı</label>

    <input
        id="baslik"
        type="text"
        placeholder="Haber başlığını yaz"
    >

    <label>Kategori</label>

    <select id="kategori">

        <option>Futbol</option>
        <option>Fenerbahçe</option>
        <option>Galatasaray</option>
        <option>Beşiktaş</option>
        <option>Trabzonspor</option>
        <option>Son Dakika</option>
        <option>Avrupa Futbolu</option>

    </select>

    <label>Haber Metni</label>

    <textarea
        id="metin"
        placeholder="Haberini buraya yaz..."
    ></textarea>

    <label>Haber Fotoğrafı</label>

    <input
        id="fotoDosya"
        type="file"
        accept="image/*"
    >

    <button
        class="yayinla"
        onclick="yayinla()"
    >
        🚀 Haberi Yayınla
    </button>

    <br>

    <button
        class="cikis"
        onclick="cikisYap()"
    >
        🚪 Yönetici Çıkışı
    </button>

</div>


<!-- =========================
     HABER DETAY
========================= -->

<div id="haberDetay">

    <button
        class="geri"
        onclick="anaSayfa()"
    >
        ← Haberlere Dön
    </button>

    <img
        id="detayFoto"
        class="detay-foto"
        style="display:none;"
    >

    <div
        id="detayKategori"
        class="detay-kategori"
    ></div>

    <h1 id="detayBaslik"></h1>

    <div
        id="detayTarih"
        class="detay-tarih"
    ></div>

    <div
        id="detayMetin"
        class="detay-metin"
    ></div>

</div>


<!-- =========================
     ANA SAYFA
========================= -->

<div id="anaIcerik">

    <h2>🔥 Son Haberler</h2>

    <div
        id="haberler"
        class="haberler"
    ></div>

</div>


</div>


<script>

/* ŞİFRE */

const YONETICI_SIFRE = "futbol2026";


/* HABERLER */

let haberler = JSON.parse(
    localStorage.getItem("futbolGundemHaberler")
) || [];


/* ANA SAYFA */

function anaSayfa() {

    document.getElementById("login").style.display = "none";

    document.getElementById("yoneticiPaneli").style.display = "none";

    document.getElementById("haberDetay").style.display = "none";

    document.getElementById("anaIcerik").style.display = "block";

    haberleriGoster();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* GİRİŞ */

function girisAc() {

    document.getElementById("login").style.display = "block";

    document.getElementById("yoneticiPaneli").style.display = "none";

    document.getElementById("haberDetay").style.display = "none";

    document.getElementById("anaIcerik").style.display = "none";

    document.getElementById("sifre").value = "";

    document.getElementById("hata").textContent = "";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* GİRİŞ YAP */

function girisYap() {

    const sifre =
        document.getElementById("sifre").value;

    if (sifre === YONETICI_SIFRE) {

        document.getElementById("login").style.display = "none";

        document.getElementById("yoneticiPaneli").style.display = "block";

        document.getElementById("anaIcerik").style.display = "block";

        haberleriGoster();

    } else {

        document.getElementById("hata").textContent =
            "❌ Şifre yanlış!";
    }
}


/* ÇIKIŞ */

function cikisYap() {

    document.getElementById("yoneticiPaneli").style.display = "none";

    haberleriGoster();

    alert("👋 Yönetici çıkışı yapıldı.");
}


/* HABER YAYINLA */

function yayinla() {

    const baslik =
        document.getElementById("baslik").value.trim();

    const kategori =
        document.getElementById("kategori").value;

    const metin =
        document.getElementById("metin").value.trim();

    const fotoDosya =
        document.getElementById("fotoDosya").files[0];


    if (baslik === "" || metin === "") {

        alert("⚠️ Başlık ve haber metnini doldur!");

        return;
    }


    if (fotoDosya) {

        const okuyucu = new FileReader();

        okuyucu.onload = function(e) {

            haberOlustur(
                baslik,
                kategori,
                metin,
                e.target.result
            );

        };

        okuyucu.readAsDataURL(fotoDosya);

    } else {

        haberOlustur(
            baslik,
            kategori,
            metin,
            ""
        );
    }
}


/* HABER OLUŞTUR */

function haberOlustur(
    baslik,
    kategori,
    metin,
    foto
) {

    const haber = {

        id: Date.now(),

        baslik: baslik,

        kategori: kategori,

        metin: metin,

        foto: foto,

        tarih: new Date().toLocaleString("tr-TR")
    };


    haberler.unshift(haber);


    localStorage.setItem(
        "futbolGundemHaberler",
        JSON.stringify(haberler)
    );


    document.getElementById("baslik").value = "";

    document.getElementById("metin").value = "";

    document.getElementById("fotoDosya").value = "";


    haberleriGoster();

    alert("🎉 Haber başarıyla yayınlandı!");
}


/* HABERLER */

function haberleriGoster() {

    const alan =
        document.getElementById("haberler");

    alan.innerHTML = "";


    if (haberler.length === 0) {

        alan.innerHTML = `
            <div class="bos">
                <h3>📰 Henüz haber yok</h3>
                <p>Yakında yeni haberler burada olacak.</p>
            </div>
        `;

        return;
    }


    haberler.forEach(function(haber) {

        const kart =
            document.createElement("div");

        kart.className = "haber";


        /* HABERE TIKLA */

        kart.onclick = function() {

            haberDetay(haber.id);

        };


        /* FOTO */

        if (haber.foto !== "") {

            const img =
                document.createElement("img");

            img.src = haber.foto;

            kart.appendChild(img);
        }


        const icerik =
            document.createElement("div");

        icerik.className = "haber-icerik";


        const kategori =
            document.createElement("div");

        kategori.className = "kategori";

        kategori.textContent =
            haber.kategori;


        const baslik =
            document.createElement("h2");

        baslik.textContent =
            haber.baslik;


        const metin =
            document.createElement("p");

        let kisa =
            haber.metin;

        if (kisa.length > 120) {

            kisa =
                kisa.substring(0,120) + "...";
        }

        metin.textContent = kisa;


        const tarih =
            document.createElement("div");

        tarih.className = "tarih";

        tarih.textContent =
            "🕐 " + haber.tarih;


        icerik.appendChild(kategori);

        icerik.appendChild(baslik);

        icerik.appendChild(metin);

        icerik.appendChild(tarih);


        /* SİL */

        const panel =
            document.getElementById(
                "yoneticiPaneli"
            );


        if (
            panel.style.display === "block"
        ) {

            const sil =
                document.createElement("button");

            sil.className = "sil";

            sil.textContent =
                "🗑️ Haberi Sil";


            sil.onclick = function(event) {

                event.stopPropagation();


                if (
                    confirm(
                        "Bu haberi silmek istediğine emin misin?"
                    )
                ) {

                    haberler =
                        haberler.filter(
                            h => h.id !== haber.id
                        );


                    localStorage.setItem(
                        "futbolGundemHaberler",
                        JSON.stringify(haberler)
                    );


                    haberleriGoster();
                }
            };


            icerik.appendChild(sil);
        }


        kart.appendChild(icerik);

        alan.appendChild(kart);

    });
}


/* HABER DETAY */

function haberDetay(id) {

    const haber =
        haberler.find(
            h => h.id === id
        );


    if (!haber) return;


    document.getElementById("anaIcerik").style.display = "none";

    document.getElementById("login").style.display = "none";

    document.getElementById("yoneticiPaneli").style.display = "none";

    document.getElementById("haberDetay").style.display = "block";


    const foto =
        document.getElementById("detayFoto");


    if (haber.foto !== "") {

        foto.src = haber.foto;

        foto.style.display = "block";

    } else {

        foto.style.display = "none";
    }


    document.getElementById(
        "detayKategori"
    ).textContent =
        haber.kategori;


    document.getElementById(
        "detayBaslik"
    ).textContent =
        haber.baslik;


    document.getElementById(
        "detayTarih"
    ).textContent =
        "🕐 Yayınlandı: " + haber.tarih;


    document.getElementById(
        "detayMetin"
    ).textContent =
        haber.metin;


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* BAŞLANGIÇ */

haberleriGoster();

</script>

</body>
</html>
